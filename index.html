<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI V5</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="password-screen" class="overlay">
  <h2>Enter Password</h2>
  <input type="password" id="password-input">
  <button id="password-submit">Start</button>
  <p id="error"></p>
</div>

<div id="jarvis" class="hidden">
  <div id="messages"></div>
<div id="input-bar">
  <button onclick="startListening()">🎤</button>
  <input id="input" placeholder="Ask Jarvis anything...">
  <button onclick="send()">➤</button>
  <button onclick="generateImage()">🖼</button>
  <button onclick="remember()">🧠</button>
</div>
 

<script src="scripts.js"></script>
</body>
</html>
