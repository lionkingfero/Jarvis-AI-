<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jarvis AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="password-screen" class="overlay">
    <h2>Enter Password to Start Jarvis</h2>
    <input type="password" id="password-input" placeholder="Password">
    <button id="password-submit">Start</button>
    <p id="password-error" class="error"></p>
  </div>

  <div id="jarvis-container" class="hidden">
    <div id="chat-window">
      <div id="messages"></div>
    </div>

    <div id="input-bar">
      <input type="text" id="user-input" placeholder="Type your message...">
      <button id="send-btn">➡️</button>
      <button id="voice-btn">🎤</button>
      <button id="memory-btn">🧠</button>
      <button id="code-btn">💻</button>
      <button id="image-btn">🖼️</button>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
