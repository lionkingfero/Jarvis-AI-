<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI V5</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Main Jarvis Screen -->
<div id="jarvis-screen">
  <div class="header">
    <h1>Jarvis AI</h1>
  </div>

  <div id="chat-window">
    <div id="messages"></div>
  </div>

  <div class="input-bar">
    <input type="text" id="user-input" placeholder="Type your message here...">
    <button id="send-btn">→</button>
    <button id="mic-btn">🎤</button>
    <button id="image-btn">+</button>
    <button id="memory-btn">🤖</button>
    <button id="generate-btn">💻</button>
  </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
